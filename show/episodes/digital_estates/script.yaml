# Digital Estates: James's vlog about inheriting a digital life.
# Hand-held selfie close-ups walking down the street and the high street, the
# phone propped up on the sofa in front of the record shelves, and on the dash
# mount in the estate car (crates of vinyl in the boot). Same words and
# directions as the voiced takes, so the cached audio is reused.
#   py ../cartoonengine/tools/run_episode.py show/episodes/digital_estates
#
# Framings: close  = james y 1418, scale 1.4  (head and shoulders)
#           xclose = james y 1825, scale 1.85 (face fills the frame)
# Selfie scenes gesture with the left hand; the right holds the phone.
# Generated from the shot plan; edit freely.
episode: digital_estates
title: Digital Estates
display_title: Digital Estates
fps: 30
width: 1280
height: 720
audio_pad: 0.05
pause_after: 0.2
lead_in: 0.15
tail: 0.1
scenes:
- name: walk_granddad
  backdrop: street
  motion: {type: recede, speed: 0.6, period: 2.0}
  handheld: {sway: 1.2, follow: 0.3}
  cast:
    james:
      x: 640
      y: 1418
      scale: 1.4
      look: center
      actions: [walk, blink, selfie]
  lead_in: 0.6
  lines:
  - character: james
    text: When my granddad died, splitting up his estate was basically a CrossFit workout.
    direction: opening the set, relaxed and warm, the last word a little punchy
    pause_after: 0.4
  - character: james
    text: Four hundred vinyl records.
    direction: flat, letting the number land
    beats:
    - {character: james, action: look, start: 0.2, dur: 1.4, dir: left}
  - character: james
    text: Heavy as lead.
    direction: deadpan
    action: still
    beats:
    - {character: james, action: nod, start: 0.1, dur: 0.8}
  - character: james
    text: Taking three trips in the estate car just to get them to my house.
    direction: weary, remembering the effort
    pause_after: 0.35
    tilt: {angle: 5, start: 0.6, dur: 2.2}
- name: walk_stood
  backdrop: street
  motion: {type: recede, speed: 0.6, period: 2.0}
  handheld: {sway: 1.2, follow: 0.3}
  cast:
    james:
      x: 640
      y: 1825
      scale: 1.85
      look: center
      actions: [walk, blink, selfie]
  lines:
  - character: james
    text: But you knew exactly where you stood!
    direction: brightening, almost nostalgic
    action: {action: point, dir: up, hand: l}
  - character: james
    text: He bought them, he owned them, boom, they were ours.
    direction: quick rhythm of three, hitting boom hard
    pause_after: 0.5
    beats:
    - {character: james, action: nod, start: 1.6}
    tilt: {angle: -6, start: 1.4, dur: 1.6}
- name: walk_tom
  backdrop: street
  motion: {type: recede, speed: 0.6, period: 2.0}
  handheld: {sway: 1.2, follow: 0.3}
  cast:
    james:
      x: 640
      y: 1418
      scale: 1.4
      look: center
      actions: [walk, blink, selfie]
  lines:
  - character: james
    text: Contrast that with my mate Tom.
    direction: shifting gear, conspiratorial
    beats:
    - {character: james, action: look, start: 0.1, dur: 1.4, dir: right}
  - character: james
    text: Tom's dad died a few months ago.
    direction: a touch softer
    action: still
  - character: james
    text: And look, Tom's dad was a legend, we miss him, this is not about grief.
    direction: sincere, hand up, reassuring the room
  - character: james
    text: This is about the absolute, farcical, administrative nightmare of modern life.
    direction: building, relishing each adjective
  - character: james
    text: One of those days where the universe just points at you and laughs.
    direction: rueful
    pause_after: 0.4
    beats:
    - {character: james, action: point, start: 1.9, dur: 1.4, dir: left, hand: l}
- name: lounge_steam
  backdrop: lounge
  handheld: {sway: 0.25}
  cast:
    james:
      x: 640
      y: 1418
      scale: 1.4
      look: center
      actions: [idle, blink]
  lines:
  - character: james
    text: See, Tom's dad was a proper first-generation digital native.
    direction: proud on the dad's behalf
  - character: james
    text: Had a massive Steam library.
    direction: impressed
  - character: james
    text: Thousands of pounds worth of games.
    direction: eyebrows up, slightly scandalised
    action: still
    beats:
    - {character: james, action: surprised, start: 0.2}
  - character: james
    text: Tom's the executor, wants to do the right thing, decides to pass the games down to his teenage nephew.
    direction: brisk storytelling, good-natured
  - character: james
    text: So Tom emails the platform.
    direction: matter of fact
  - character: james
    text: Here's the death certificate, lads. Let's transfer the account.
    direction: playing Tom, cheerful and naive
    pause_after: 0.4
    beats:
    - {character: james, action: shrug, start: 1.6}
- name: lounge_bam
  backdrop: lounge
  handheld: {sway: 0.25}
  cast:
    james:
      x: 640
      y: 1825
      scale: 1.85
      look: center
      actions: [idle, blink]
  lines:
  - character: james
    text: What do they do?
    direction: leaning in, quiet
    action: still
  - character: james
    text: Bam.
    direction: sharp, sudden
    pause_after: 0.5
    action: still
    beats:
    - {character: james, action: surprised, start: 0.0, dur: 0.9}
    tilt: {angle: 8, start: 0.0, dur: 1.0}
  - character: james
    text: Gone.
    direction: flat
    action: still
  - character: james
    text: Vaporized.
    direction: drawn out, appalled
    pause_after: 0.5
    action: still
    beats:
    - {character: james, action: head_shake, start: 0.3}
- name: lounge_licenses
  backdrop: lounge
  handheld: {sway: 0.25}
  cast:
    james:
      x: 640
      y: 1418
      scale: 1.4
      look: center
      actions: [idle, blink]
  lines:
  - character: james
    text: '"Licenses expire upon death, sir."'
    direction: impersonating a bored, robotic customer service agent
    action: still
    beats:
    - {character: james, action: arms_crossed, start: 0.0}
  - character: james
    text: Account permanently closed.
    direction: same robotic voice, final
    pause_after: 0.35
    action: still
    beats:
    - {character: james, action: arms_crossed, start: 0.0}
  - character: james
    text: In trying to be a good guy and do the right thing, Tom legally incinerated his nephew's inheritance in about four seconds.
    direction: back to himself, incredulous, speeding up to the punchline
    pause_after: 0.3
  - character: james
    text: Well done, Tom.
    direction: dry, sarcastic
    pause_after: 0.6
    action: still
    beats:
    - {character: james, action: facepalm, start: 0.0, dur: 1.9}
- name: car_crypto
  backdrop: car
  handheld: {sway: 0.3}
  cast:
    james:
      x: 640
      y: 1418
      scale: 1.4
      look: center
      actions: [idle, blink]
  lines:
  - character: james
    text: Slightly bruised, he moves on to the financial stuff.
    direction: picking the story back up
  - character: james
    text: Dad was into crypto.
    direction: a knowing look at the audience
    action: still
    beats:
    - {character: james, action: look, start: 0.1, dur: 1.2, dir: right}
  - character: james
    text: Left behind a hardware wallet with a decent chunk of change on it.
    direction: impressed
  - character: james
    text: But Tom needs the twenty-four word seed phrase.
    direction: a warning note creeping in
  - character: james
    text: Dad kept a backup in a secure email.
    direction: relieved
  - character: james
    text: Smart!
    direction: bright, approving
    action: {action: point, dir: up}
  - character: james
    text: So Tom sits at the PC, types in the password, hits enter.
    direction: miming the steps, tense and quick
- name: car_code
  backdrop: car
  handheld: {sway: 0.3}
  cast:
    james:
      x: 640
      y: 1825
      scale: 1.85
      look: center
      actions: [idle, blink]
  lines:
  - character: james
    text: Screen blinks.
    direction: hushed
    action: still
  - character: james
    text: '"Please enter the six-digit code sent to your mobile device."'
    direction: a calm, cheerful automated voice
    pause_after: 0.5
    action: still
    beats:
    - {character: james, action: worried, start: 0.4}
    tilt: {angle: -5, start: 1.0, dur: 2.4}
- name: car_sweat
  backdrop: car
  handheld: {sway: 0.3}
  cast:
    james:
      x: 640
      y: 1418
      scale: 1.4
      look: center
      actions: [idle, blink]
  lines:
  - character: james
    text: You can physically see the cold sweat form on Tom's neck.
    direction: savouring it
    beats:
    - {character: james, action: worried, start: 0.0}
  - character: james
    text: Because Tom is a highly efficient executor.
    direction: heavy sarcasm on highly efficient
  - character: james
    text: His very first act, yesterday morning, was calling the telecom provider to cancel his dad's phone contract.
    direction: building dread
  - character: james
    text: SIM card? Dead.
    direction: a list of disasters, clipped
    action: still
    beats:
    - {character: james, action: head_shake, start: 0.4}
  - character: james
    text: Number? Deactivated.
    direction: clipped
    action: still
  - character: james
    text: That two-factor authentication chain? Smashed to pieces.
    direction: the payoff, loud
    pause_after: 0.4
    beats:
    - {character: james, action: shrug, start: 1.7}
- name: car_cloud
  backdrop: car
  handheld: {sway: 0.3}
  cast:
    james:
      x: 640
      y: 1825
      scale: 1.85
      look: center
      actions: [idle, blink]
  lines:
  - character: james
    text: He's not just locked out of the crypto.
    direction: low, serious
    action: still
    beats:
    - {character: james, action: worried, start: 0.0}
  - character: james
    text: He's locked out of the cloud.
    direction: landing it
    action: still
    beats:
    - {character: james, action: worried, start: 0.0}
  - character: james
    text: A decade of family photos, videos, memories, suddenly sealed behind an impenetrable cryptographic blast door.
    direction: mock-epic, like a movie trailer
    pause_after: 0.5
    beats:
    - {character: james, action: worried, start: 0.0, dur: 3.0}
